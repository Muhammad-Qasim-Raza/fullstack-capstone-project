services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  backend:
    build: .
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: giftlink
      JWT_SECRET: change-this-in-production
      CLIENT_URL: http://localhost:5173
    depends_on: [mongodb]
    ports: ["5000:5000"]
volumes:
  mongo_data:
